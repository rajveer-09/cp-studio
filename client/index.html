<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Write, run and debug C++, Java and Python with test cases and an AI assistant." />
    <meta name="author" content="Rajveer Sharma" />
    <title>CP Studio</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before the first paint so there is no flash.
      try {
        var root = document.documentElement;
        var cached = JSON.parse(localStorage.getItem('cp-studio-theme') || 'null');
        if (cached) {
          if (cached.dark) root.classList.add('dark');
          root.style.colorScheme = cached.dark ? 'dark' : 'light';
          for (var name in cached.vars) root.style.setProperty(name, cached.vars[name]);
          if (cached.ide) {
            var style = document.createElement('style');
            style.id = 'ide-theme';
            style.textContent = cached.ide;
            document.head.appendChild(style);
          }
        } else if (!matchMedia('(prefers-color-scheme: light)').matches) {
          root.classList.add('dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
